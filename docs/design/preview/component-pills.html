<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg); font-family: var(--font-sans); }
  .wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill svg { width: 10px; height: 10px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
</style></head><body>
  <div class="wrap">
    <span class="pill pill-info"><span class="dot" style="background:var(--info-500)"></span>Draft</span>
    <span class="pill pill-warning"><span class="dot" style="background:var(--warning-500)"></span>Pending review</span>
    <span class="pill pill-success"><span class="dot" style="background:var(--success-500)"></span>Approved</span>
    <span class="pill pill-success"><span class="dot" style="background:var(--success-500)"></span>Paid</span>
    <span class="pill pill-danger"><span class="dot" style="background:var(--danger-500)"></span>Rejected</span>
    <span class="pill pill-danger"><span class="dot" style="background:var(--danger-500)"></span>Overdue</span>
    <span class="pill pill-accent">Sent</span>
    <span class="pill">Manual</span>
    <span class="pill">Airbnb</span>
  </div>
</body></html>
