<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-sans); }
  .wrap { max-width: 620px; }
  .title { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); margin-bottom: 12px; }
  .stack { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-size: 14px; color: var(--fg); line-height: 1.6; }
  .stack strong { font-weight: 600; }
  .mono { font-family: var(--font-mono); font-size: 13px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; display: block; margin-top: 12px; white-space: pre; overflow-x: auto; }
</style></head><body>
  <div class="wrap">
    <div class="title">font stacks</div>
    <div class="stack">
      <strong>Sans</strong> · <code class="mono">ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif</code>
      <strong>Mono</strong> · <code class="mono">ui-monospace, SFMono-Regular, Menlo, Consolas, monospace</code>
    </div>
  </div>
</body></html>
