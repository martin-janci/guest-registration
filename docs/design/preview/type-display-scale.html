<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg); }
  .wrap { display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap; }
  .item { display:flex; flex-direction:column; gap:4px; }
  .label { font-size: 11px; color: var(--fg-subtle); font-family: var(--font-mono); }
  .specimen { color: var(--fg); font-family: var(--font-sans); letter-spacing: var(--tracking-tight); line-height: 1.1; }
  .s48 { font-size: 48px; font-weight: 600; }
  .s36 { font-size: 36px; font-weight: 600; }
  .s30 { font-size: 30px; font-weight: 600; }
  .s24 { font-size: 24px; font-weight: 600; }
  .s20 { font-size: 20px; font-weight: 600; letter-spacing: 0;}
</style></head><body>
  <div class="wrap">
    <div class="item"><span class="specimen s48">Aa</span><span class="label">48 / 600</span></div>
    <div class="item"><span class="specimen s36">Aa</span><span class="label">36 / 600</span></div>
    <div class="item"><span class="specimen s30">Aa</span><span class="label">30 / 600</span></div>
    <div class="item"><span class="specimen s24">Aa</span><span class="label">24 / 600</span></div>
    <div class="item"><span class="specimen s20">Aa</span><span class="label">20 / 600</span></div>
  </div>
</body></html>
