<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-mono); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row + .row { margin-top: 10px; }
  .swatch { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--border); }
  .meta { font-size: 11px; color: var(--fg-subtle); min-width: 80px; }
  .name { font-size: 12px; color: var(--fg); min-width: 120px; }
  .token { font-size: 11px; color: var(--fg-muted); }
</style></head><body>
  <div class="row"><div class="swatch" style="background:var(--accent-50)"></div><span class="meta">50</span><span class="name">Accent 50</span><span class="token">--accent-50</span></div>
  <div class="row"><div class="swatch" style="background:var(--accent-100)"></div><span class="meta">100</span><span class="name">Accent 100</span><span class="token">--accent-100</span></div>
  <div class="row"><div class="swatch" style="background:var(--accent-300)"></div><span class="meta">300</span><span class="name">Accent 300</span><span class="token">--accent-300</span></div>
  <div class="row"><div class="swatch" style="background:var(--accent-500)"></div><span class="meta">500</span><span class="name">Accent 500 · primary</span><span class="token">--accent-500</span></div>
  <div class="row"><div class="swatch" style="background:var(--accent-600)"></div><span class="meta">600</span><span class="name">Accent 600 · hover</span><span class="token">--accent-600</span></div>
  <div class="row"><div class="swatch" style="background:var(--accent-700)"></div><span class="meta">700</span><span class="name">Accent 700 · active</span><span class="token">--accent-700</span></div>
  <div class="row"><div class="swatch" style="background:var(--accent-900)"></div><span class="meta">900</span><span class="name">Accent 900</span><span class="token">--accent-900</span></div>
</body></html>
