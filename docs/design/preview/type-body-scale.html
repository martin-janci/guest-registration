<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .col { display:flex; flex-direction:column; gap: 14px; max-width: 620px; }
  .row { display:grid; grid-template-columns: 72px 1fr; gap: 16px; align-items: baseline; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); }
  .b18 { font-size: 18px; font-weight: 500; color: var(--fg); }
  .b16 { font-size: 16px; font-weight: 400; color: var(--fg); }
  .b14 { font-size: 14px; font-weight: 400; color: var(--fg); }
  .b13 { font-size: 13px; font-weight: 400; color: var(--fg-muted); }
  .b12 { font-size: 12px; font-weight: 500; color: var(--fg-subtle); text-transform: uppercase; letter-spacing: 0.08em; }
</style></head><body>
  <div class="col">
    <div class="row"><span class="meta">18 / 500</span><span class="b18">Section title — property detail</span></div>
    <div class="row"><span class="meta">16 / 400</span><span class="b16">Guest body copy on a mobile phone screen.</span></div>
    <div class="row"><span class="meta">14 / 400</span><span class="b14">Admin default body — table rows, labels, paragraphs.</span></div>
    <div class="row"><span class="meta">13 / 400</span><span class="b13">Helper text, timestamps, secondary metadata.</span></div>
    <div class="row"><span class="meta">12 / 500</span><span class="b12">Overline · caps label</span></div>
  </div>
</body></html>
