<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg); font-family: var(--font-mono); }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .bar { background: var(--accent-500); height: 12px; border-radius: 3px; }
  .tok { font-size: 11px; color: var(--fg-muted); min-width: 60px; }
  .val { font-size: 11px; color: var(--fg-subtle); min-width: 40px; }
</style></head><body>
  <div class="row"><span class="tok">1</span><span class="val">4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tok">2</span><span class="val">8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok">3</span><span class="val">12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="tok">4</span><span class="val">16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok">6</span><span class="val">24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok">8</span><span class="val">32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tok">12</span><span class="val">48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok">16</span><span class="val">64px</span><div class="bar" style="width:64px"></div></div>
</body></html>
