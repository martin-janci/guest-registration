<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 720px; }
  .card { display: flex; flex-direction: column; gap: 4px; padding: 16px; }
  .kpi-label { font-size: 12px; color: var(--fg-muted); font-weight: 500; letter-spacing: 0.02em; }
  .kpi-value { font-size: 28px; color: var(--fg); font-weight: 600; letter-spacing: -0.015em; line-height: 1.1; }
  .kpi-delta { font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
  .up { color: var(--success-700); }
  .warn { color: var(--warning-700); }
</style></head><body>
  <div class="row">
    <div class="card">
      <div class="kpi-label">Arrivals this week</div>
      <div class="kpi-value">12</div>
      <div class="kpi-delta up">▲ 3 vs last week</div>
    </div>
    <div class="card">
      <div class="kpi-label">Pending registrations</div>
      <div class="kpi-value">5</div>
      <div class="kpi-delta warn">Needs attention</div>
    </div>
    <div class="card">
      <div class="kpi-label">Overdue invoices</div>
      <div class="kpi-value">€ 840,00</div>
      <div class="kpi-delta" style="color: var(--fg-muted)">2 invoices</div>
    </div>
  </div>
</body></html>
