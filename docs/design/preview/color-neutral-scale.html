<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-mono); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 640px; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .swatch { height: 48px; border-radius: 6px; border: 1px solid var(--border); }
  .label { font-size: 10px; color: var(--fg-subtle); text-align: center; }
</style></head><body>
  <div class="grid">
    <div class="cell"><div class="swatch" style="background:var(--neutral-0)"></div><div class="label">0</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-100)"></div><div class="label">100</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-200)"></div><div class="label">200</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-300)"></div><div class="label">300</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-400)"></div><div class="label">400</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-500)"></div><div class="label">500</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-600)"></div><div class="label">600</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-700)"></div><div class="label">700</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-800)"></div><div class="label">800</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-900)"></div><div class="label">900</div></div>
    <div class="cell"><div class="swatch" style="background:var(--neutral-950)"></div><div class="label">950</div></div>
  </div>
</body></html>
