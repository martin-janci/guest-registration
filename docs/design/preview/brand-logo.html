<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-sans); display: flex; justify-content: center; }
  .wrap { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .mark { display: flex; align-items: center; gap: 10px; }
  .small { width: 24px; height: 24px; }
  .med { width: 32px; height: 32px; }
  .wordmark { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; color: var(--fg); }
  .accent { color: var(--accent-500); }
  .caption { font-size: 11px; font-family: var(--font-mono); color: var(--fg-subtle); }
</style></head><body>
  <div class="wrap">
    <div class="mark"><img src="../assets/logo.svg" height="42"/></div>
    <div class="mark"><img src="../assets/logo-mark.svg" class="med"/><span class="wordmark">Guest Registration<span class="accent"> System</span></span></div>
    <div class="mark"><img src="../assets/logo-mark.svg" class="small"/><span class="caption">mark only · favicons / tight layouts</span></div>
    <div class="caption" style="margin-top: 6px">Product name "Guest Registration System" · domain airbnb.rlt.sk used as sub-line / URL chrome only</div>
  </div>
</body></html>
