<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-width: 660px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .chip { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0; }
  .token { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .name { font-size: 12px; color: var(--fg); font-weight: 500; }
</style></head><body>
  <div class="grid">
    <div class="row"><div class="chip" style="background:var(--bg)"></div><div><div class="name">Page background</div><div class="token">--bg</div></div></div>
    <div class="row"><div class="chip" style="background:var(--surface)"></div><div><div class="name">Surface (cards)</div><div class="token">--surface</div></div></div>
    <div class="row"><div class="chip" style="background:var(--surface-2)"></div><div><div class="name">Surface 2</div><div class="token">--surface-2</div></div></div>
    <div class="row"><div class="chip" style="background:var(--border)"></div><div><div class="name">Border</div><div class="token">--border</div></div></div>
    <div class="row"><div class="chip" style="background:var(--fg)"></div><div><div class="name">Foreground</div><div class="token">--fg</div></div></div>
    <div class="row"><div class="chip" style="background:var(--fg-muted)"></div><div><div class="name">Foreground muted</div><div class="token">--fg-muted</div></div></div>
  </div>
</body></html>
